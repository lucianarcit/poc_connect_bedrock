[project]
name = "amazon-connect-mcp-poc"
version = "0.1.0"
description = "POC: Amazon Connect Chat + MCP Server com AWS Lambda e Terraform"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "boto3>=1.34.0",
    "mcp>=1.0.0",
    "mangum>=0.17.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "moto>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
